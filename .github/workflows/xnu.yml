name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: Fixed dependency profile (xnu-8796, iOS 16 era)
        type: choice
        options: ["13.5"]
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      machine_configs:
        description: space-separated MACHINE_CONFIGs (sweet, gauguin); keep one
          per run so the web log fits Actions' size limit
        default: "gauguin"
      host_checks:
        description: Host test lane (ui-trace is the focused clean-tree regression suite)
        type: choice
        options: ["all", "ui-trace"]
        default: "all"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "deps/**"
      - "tools/xnu-*.py"
      - "tests/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  MACHINE_CONFIGS: ${{ inputs.machine_configs || 'gauguin' }}
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  HOST_CHECKS: ${{ inputs.host_checks || 'all' }}

jobs:
  build:
    # Record the runner's actual Xcode/SDK/iig in the build manifest.
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Validate fixed build profile
        run: |
          test "$MACOS_VERSION" = 13.5 || { echo "Only the pinned 13.5 dependency profile is supported" >&2; exit 1; }
          case "$KERNEL_CONFIG" in DEVELOPMENT|RELEASE|DEBUG) ;; *) exit 1;; esac
          case "$HOST_CHECKS" in all|ui-trace) ;; *) exit 1;; esac
          if [ "$HOST_CHECKS" = ui-trace ]; then
            test "$MACHINE_CONFIGS" = gauguin || exit 1
          fi
          for mc in $MACHINE_CONFIGS; do
            case "$mc" in sweet|gauguin) ;; *) echo "Unsupported machine: $mc" >&2; exit 1;; esac
          done

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # The project series is applied strictly below. dxb's patch loop
          # skips malformed/conflicting patches and cannot validate this port.
          python3 tools/xnu-patches.py list
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      # dxb only for what it is good at on a Mac: Xcode bootstrap tools
      # (mig, ctfmerge), KDK, the macOS xnu clone and the staging/building
      # steps. The staging scripts' downloads are replaced by the in-repo
      # mirror (deps/mirror): apple-oss-distributions and bearssl.org are
      # still one more network dependency, and the repo is already here.
      # Everything in one shell: dxb's functions set variables (libplatform/
      # libdispatch repos, KDK paths) that later calls need, so the steps
      # cannot be spread over separate Actions steps.
      - name: Build kernel (apply the series, build each MACHINE_CONFIG)
        id: dxb
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          cat > run-dxb.sh <<'SH'
          # dxb's build.sh defines its functions and then runs `main "$@"`.
          # Sourcing it would also redefine main, so neutralise that last line
          # first, source the function library, and then call only the steps
          # this workflow asks for (DXB_STEPS).
          sed -i.bak 's/^main "\$@"$/:/' ./build.sh
          set +e +u
          source ./build.sh
          echo "sourced build.sh (rc=$?)"
          set +e +u
          source "$GITHUB_WORKSPACE/deps/dxb-project.sh" || exit 1
          (
            # Calling a function in an || list disables errexit throughout it.
            # dxb helpers often cd/touch after make, so call each unconditionally.
            set -e
            for step in $DXB_STEPS; do
              echo "==== dxb step: $step"
              "$step"
            done
          ) > /tmp/dxb-${DXB_STEP_NAME:-steps}.log 2>&1
          rc=$?
          echo "==== dxb ${DXB_STEP_NAME:-steps} rc=$rc"
          # show the first real diagnostics with context: xnu's build prints
          # the failing command, the diagnostic and the caret lines around it
          # skip the patch step's noise (dxb warns about every patch it skips)
          BLOG=/tmp/dxb-${DXB_STEP_NAME:-steps}.log
          awk '/Applying patch:|Skipping patch|already exists in working directory|patch does not apply/{skip=3; next} skip>0{skip--; next} {print}' \
            "$BLOG" > "$BLOG.clean"
          grep -nE "fatal error|error:|Undefined symbols|No such file" "$BLOG.clean" | head -20 || true
          echo "==== diagnostics with context"
          grep -nE "fatal error|error:|Undefined symbols" "$BLOG.clean" | grep -v warning | head -3 | cut -d: -f1 \
            | while read -r n; do sed -n "$((n > 2 ? n - 2 : 1)),$((n + 25))p" "$BLOG.clean"; echo "   ---"; done || true
          tail -15 /tmp/dxb-${DXB_STEP_NAME:-steps}.log
          exit $rc
          SH
          # Stage dependencies before strictly applying the pinned XNU series.
          DXB_STEPS="install_deps setup_xcode_toolchain choose_xnu get_project_xnu apply_project_patches venv build_bootstrap_cmds build_dtrace build_availabilityversions" \
            DXB_STEP_NAME=bootstrap bash run-dxb.sh || exit 1
          ls -la fakeroot/usr/local/bin | head -20
          if [ "$HOST_CHECKS" = ui-trace ]; then
            python3 "$GITHUB_WORKSPACE/tools/run-ui-kernel-checks.py" \
              --source "$PWD/xnu" --out "$GITHUB_WORKSPACE/out/ui-host-checks" || exit 1
          else
            XNU_SOURCE="$PWD/xnu" bash "$GITHUB_WORKSPACE/tests/run-all.sh" || exit 1
          fi
          mkdir -p out
          fail=0
          for mc in $MACHINE_CONFIGS; do
            echo "==== MACHINE_CONFIG=$mc"
            # choose_xnu re-sets RELEASE_URL/KDKROOT/RC_DARWIN_KERNEL_VERSION:
            # dxb's variables do not survive the previous bash invocation.
            DXB_STEPS="choose_xnu xnu_headers libsystem_headers libsyscall_headers build_libplatform build_libdispatch build_project_xnu" \
              DXB_STEP_NAME="build-$mc" MACHINE_CONFIG="$mc" bash run-dxb.sh || fail=1
            ls -la out
          done
          exit $fail

      - name: Upload dxb logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dxb-logs
          path: |
            /tmp/dxb-*.log
            dxb/build/runs/*/build-manifest.json
            out/ui-host-checks/
          retention-days: 7

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/out/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
