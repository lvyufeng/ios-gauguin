name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG passed to dxb (overridden by machine_configs)
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      machine_configs:
        description: space-separated MACHINE_CONFIGs (sweet, gauguin); keep one
          per run so the web log fits Actions' size limit
        default: "gauguin"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  MACHINE_CONFIGS: ${{ inputs.machine_configs || 'gauguin' }}
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      # dxb only for what it is good at on a Mac: Xcode bootstrap tools
      # (mig, ctfmerge), KDK, the macOS xnu clone and the staging/building
      # steps. The staging scripts' downloads are replaced by the in-repo
      # mirror (deps/mirror): apple-oss-distributions and bearssl.org are
      # still one more network dependency, and the repo is already here.
      - name: dxb bootstrap (build.sh up to the platform libraries)
        id: dxb
        working-directory: dxb
        run: |
          set -o pipefail
          # Run dxb until just before its own `patches` step would download;
          # the functions are independent, so call them explicitly.
          cat > run-dxb.sh <<'SH'
          set -eo pipefail
          source ./build.sh --help >/dev/null 2>&1 || true
          install_deps
          setup_xcode_toolchain
          choose_xnu
          get_xnu
          venv
          build_bootstrap_cmds
          build_dtrace
          build_availabilityversions
          SH
          # build.sh runs main() at the end; strip that call when sourced.
          sed -i '$ d' build.sh 2>/dev/null || true
          bash run-dxb.sh 2>&1 | tee /tmp/dxb-bootstrap.log
          ls -la fakeroot/usr/local/bin | head -20

      - name: Patches and staging from the in-repo mirror
        working-directory: dxb/xnu
        run: |
          set -eo pipefail
          export MACHINE_CONFIG=${{ inputs.machine_config || 'SWEET' }} MACOS_VERSION=13.5
          # the two scripts that download are replaced by deps/apply-patches.sh;
          # it applies every patch in order and fails on the first mismatch
          "$GITHUB_WORKSPACE/deps/apply-patches.sh" "$PWD" "$GITHUB_WORKSPACE/deps/mirror" \
            "${{ inputs.machine_config || 'SWEET' }}"

      - name: xnu headers, system headers, libplatform, libdispatch
        working-directory: dxb
        run: |
          set -eo pipefail
          source ./run-dxb.sh
          xnu_headers
          libsystem_headers
          libsyscall_headers
          build_libplatform
          build_libdispatch

      # One dxb invocation per MACHINE_CONFIG: dxb's patch step is complete
      # by then, only fakeroot/Kernels/* differ. gauguin shares the SWEET
      # sources (-DGAUGUIN selects the board layout in bsd/dev/sweet_*.c).
      - name: Build kernel
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -eo pipefail
          source ./run-dxb.sh
          mkdir -p out
          fail=0
          for mc in $MACHINE_CONFIGS; do
            echo "==== MACHINE_CONFIG=$mc"
            rm -rf fakeroot/System/Library/Kernels
            MACHINE_CONFIG="$mc" bash -c 'source ./run-dxb.sh; build_xnu' 2>&1 | tail -2000 || fail=1
            for k in fakeroot/System/Library/Kernels/*; do
              [ -e "$k" ] && cp "$k" "out/$(basename "$k").$mc"
            done
            ls -la out
          done
          exit $fail

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/out/. out/ 2>/dev/null || true
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
